<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Quản lý hồ sơ - Cap1</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.wrap{max-width:1100px;margin:90px auto;padding:20px}
		.card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);margin-bottom:12px}
		.grid{display:grid;grid-template-columns:1fr 320px;gap:18px}
		.list{display:flex;flex-direction:column;gap:10px}
		.muted{color:#9aa6bf}
		.input{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:10px;border-radius:8px;color:inherit}
		.btn{padding:8px 12px;border-radius:8px;border:none;cursor:pointer}
		.btn.primary{background:linear-gradient(90deg,#7c3aed,#06b6d4);color:#021028;font-weight:700}
		.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#cfe7ff}
	</style>
</head>
<body>
	<div class="exam-header">
		<h2>Quản lý hồ sơ ứng viên</h2>
		<div style="display:flex;gap:8px;align-items:center">
			<button id="addBtn" class="btn primary">Thêm hồ sơ</button>
			<button id="exportBtn" class="btn ghost">Xuất JSON</button>
		</div>
	</div>

	<main class="wrap">
		<div class="grid">
			<section>
				<div id="list" class="list"></div>
				<div id="empty" class="muted">Chưa có hồ sơ. Nhấn Thêm hồ sơ để bắt đầu.</div>
			</section>

			<aside>
				<div class="card">
					<h3 id="formTitle">Thêm hồ sơ</h3>
					<div style="display:flex;flex-direction:column;gap:8px">
						<input id="first" class="input" placeholder="Họ" />
						<input id="last" class="input" placeholder="Tên" />
						<input id="email" class="input" placeholder="Email" />
						<input id="phone" class="input" placeholder="SĐT" />
						<input id="position" class="input" placeholder="Vị trí" />
						<label class="muted">Tải lên CV (PDF)</label>
						<input id="cv" type="file" accept="application/pdf" />
						<div style="display:flex;gap:8px;margin-top:8px">
							<button id="save" class="btn primary">Lưu</button>
							<button id="cancel" class="btn ghost">Hủy</button>
						</div>
					</div>
				</div>
			</aside>
		</div>
	</main>

	<script>
		// Simple client-side CV manager using localStorage; can be wired to backend later
		const LS = 'cap1_candidates_v1';
		function uid(){return 'c-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)}
		function read(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
		function write(v){localStorage.setItem(LS, JSON.stringify(v))}

		const listEl = document.getElementById('list');
		const emptyEl = document.getElementById('empty');

		function render(){
			const items = read(); listEl.innerHTML='';
			if(!items.length){ emptyEl.style.display='block'; return } else emptyEl.style.display='none';
			items.forEach(it=>{
				const el = document.createElement('div'); el.className='card';
				el.innerHTML = `<strong style="color:var(--neon1)">${escape(it.first_name+' '+(it.last_name||''))}</strong>
					<div class="muted">${escape(it.position||'')}</div>
					<div>${escape(it.email||'')}</div>
					<div>${escape(it.phone||'')}</div>
					<div style="margin-top:8px">
						<button data-id="${it.id}" class="btn ghost" data-action="view">Xem</button>
						<button data-id="${it.id}" class="btn" data-action="download">Tải</button>
						<button data-id="${it.id}" class="btn ghost" data-action="edit">Sửa</button>
						<button data-id="${it.id}" class="btn ghost" data-action="del">Xóa</button>
					</div>`;
				listEl.appendChild(el);
			});
		}
		function escape(s){return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}

		document.getElementById('addBtn').addEventListener('click', ()=>{ document.getElementById('first').value=''; document.getElementById('last').value=''; document.getElementById('email').value=''; document.getElementById('phone').value=''; document.getElementById('position').value=''; document.getElementById('cv').value=''; document.getElementById('formTitle').textContent='Thêm hồ sơ'; window.scrollTo({top:0,behavior:'smooth'}) })

		document.getElementById('save').addEventListener('click', async ()=>{
			const first=document.getElementById('first').value.trim(); if(!first){alert('Nhập họ');return}
			const last=document.getElementById('last').value.trim(); const email=document.getElementById('email').value.trim(); const phone=document.getElementById('phone').value.trim(); const position=document.getElementById('position').value.trim();
			const f = document.getElementById('cv').files[0]; let cvData=''; let cvName='';
			if(f){ cvName = f.name; cvData = await readFileAsDataURL(f) }
			const all = read(); all.unshift({id:uid(), first_name:first, last_name:last, email, phone, position, cvData, cvName, createdAt:Date.now()}); write(all); render(); showAlert('Lưu thành công')
		})

		document.getElementById('cancel').addEventListener('click', ()=>{ document.getElementById('first').value=''; document.getElementById('last').value=''; document.getElementById('email').value=''; document.getElementById('phone').value=''; document.getElementById('position').value=''; document.getElementById('cv').value=''; document.getElementById('formTitle').textContent='Thêm hồ sơ' })

		listEl.addEventListener('click', (e)=>{
			const b = e.target.closest('button'); if(!b) return; const id=b.dataset.id; const action=b.dataset.action; const all = read(); const idx = all.findIndex(x=>x.id===id);
			if(action==='del'){ if(confirm('Xóa hồ sơ?')){ all.splice(idx,1); write(all); render(); showAlert('Đã xóa') } }
			else if(action==='view'){ if(idx>-1 && all[idx].cvData){ openData(all[idx].cvData) } else alert('Không có file') }
			else if(action==='download'){ if(idx>-1 && all[idx].cvData){ downloadData(all[idx].cvData, all[idx].cvName||('cv-'+all[idx].id+'.pdf')) } else alert('Không có file') }
			else if(action==='edit'){ if(idx>-1){ const it=all[idx]; document.getElementById('first').value=it.first_name||''; document.getElementById('last').value=it.last_name||''; document.getElementById('email').value=it.email||''; document.getElementById('phone').value=it.phone||''; document.getElementById('position').value=it.position||''; document.getElementById('formTitle').textContent='Sửa hồ sơ'; window.scrollTo({top:0,behavior:'smooth'}) } }
		})

		function readFileAsDataURL(f){return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f) })}
		function openData(d){ const w=window.open('about:blank'); if(w){ w.document.write('<iframe src="'+d+'" style="width:100%;height:100vh;border:none"></iframe>') } }
		function downloadData(d, name){ const a=document.createElement('a'); a.href=d; a.download=name; document.body.appendChild(a); a.click(); a.remove() }

		document.getElementById('exportBtn').addEventListener('click', ()=>{ const b=new Blob([JSON.stringify(read(),null,2)],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='candidates.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u) })

		function showAlert(msg){ let a=document.querySelector('.alert-box'); if(!a){ a=document.createElement('div'); a.className='alert-box'; a.style= 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#2b2bff,#a16eff);color:#fff;padding:16px;border-radius:12px;z-index:9999'; document.body.appendChild(a) } a.textContent=msg; setTimeout(()=>a.remove(),1600) }

		// init
		render();
	</script>
</body>
</html>
